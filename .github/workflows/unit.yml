name: Unit

on:
  pull_request:
    branches: [main]
  push:
    # ci/** branches run it too: a new workflow cannot be started by hand
    # before it is on main.
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@578473461fc30c68c68fc6e07941dcfc2c070b54 # v0.5.10
      - uses: Telosnex/telosnex_ci_tools/actions/lint@578473461fc30c68c68fc6e07941dcfc2c070b54 # v0.5.10
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool hook example
      - run: dart analyze --fatal-infos
      - run: dart run kiln:check
      # The hook builds the library from source until the first release.
      - run: dart test -r expanded
